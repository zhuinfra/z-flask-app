name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/z-flask-app:latest
            ${{ secrets.DOCKER_USERNAME }}/z-flask-app:${{ env.IMAGE_TAG }}

      - name: Set up SSH key for gitops repo
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITOPS_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Update gitops repo
        if: github.event_name == 'push'
        run: |
          git clone git@github.com:zhuinfra/z-flask-gitops.git /tmp/gitops
          cd /tmp/gitops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          sed -i "s|newTag: .*|newTag: ${{ env.IMAGE_TAG }}|" overlays/production/kustomization.yaml
          git add overlays/production/kustomization.yaml
          git commit -m "Update image tag to ${{ env.IMAGE_TAG }}"
          git push
